spring.application.name=SquareGameUsers
server.port=8081

# Base H2 en memoire
spring.datasource.url=jdbc:h2:mem:squaregameusers;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dev : renvoyer le message d'erreur dans la reponse JSON
server.error.include-message=always

# JWT (dev only: a real deployment must inject this secret via env var, not commit it)
jwt.secret=dev-only-secret-key-change-me-please-32bytes-min
jwt.expiration-ms=3600000
