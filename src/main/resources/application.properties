spring.application.name=SquareGames
server.port=8080

# JWT : doit être la MEME cle que jwt.secret dans SquareGameUsers (projet separe, port 8081) —
# c'est ce qui permet a cette app de valider localement les tokens qu'elle emet, sans appel reseau.
jwt.secret=dev-only-secret-key-change-me-please-32bytes-min

# Profils actifs (combinables) :
# - implementation de GameDao : in-memory / jdbc / jpa
# - base de donnees : h2 (en memoire, par defaut) / postgres (cible reelle, via docker)
# "jdbc" est ecrit pour Postgres (SQL non portable) : ne le combiner qu'avec "postgres".
# "jpa" est portable et fonctionne avec "h2" ou "postgres".
# Override au demarrage : --spring.profiles.active=jpa,postgres
spring.profiles.active=jpa,h2

# Dev : renvoyer le message d'erreur dans la réponse JSON
server.error.include-message=always

# i18n : ne pas retomber sur la locale systeme quand la langue demandee est absente
spring.messages.fallback-to-system-locale=false

# Valeurs par défaut par jeu (utilisees quand playerCount / boardSize sont absents de la requete)
game.tictactoe.default-player-count=2
game.tictactoe.default-board-size=3
game.connect4.default-player-count=2
game.connect4.default-board-size=7
game.taquin.default-player-count=1
game.taquin.default-board-size=3
