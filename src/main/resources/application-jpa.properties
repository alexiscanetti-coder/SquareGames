# DAO JPA (JpaGameDao) : Hibernate gere le schema lui-meme (game_entity / game_token_entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Charge les joueurs/jetons de plusieurs parties en une requete (IN) au lieu d'une requete par partie (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
