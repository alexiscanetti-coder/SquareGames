# DAO JDBC (JdbcGameDao) : le schema est defini a la main dans schema.sql
# SQL ecrit a la main, propre a Postgres (upsert "ON CONFLICT ... DO UPDATE") : ce profil
# suppose --spring.profiles.active=jdbc,postgres. Combine a "h2", JdbcGameDao.save() echoue
# (syntaxe non supportee par H2) ; utiliser le profil "jpa" pour tester avec H2.
spring.sql.init.mode=always
